name: NDU OR R25 complete publication and final-SHA validation
on:
  push:
    branches: [revision/ndu-operations-research-r25-20260923]
    paths: [.github/workflows/ndu-or-r25-publication.yml]
permissions:
  contents: write
  statuses: write
  actions: read
concurrency:
  group: ndu-or-r25-publication
  cancel-in-progress: true
env:
  REVISION_BRANCH: revision/ndu-operations-research-r25-20260923
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  GH_TOKEN: ${{ github.token }}
jobs:
  publish:
    if: github.ref == 'refs/heads/revision/ndu-operations-research-r25-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      final_sha: ${{ steps.publish.outputs.final_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify source overlay and preserve the exact reviewed predecessor
        run: |
          python - <<'PY'
          import base64, hashlib, io, tarfile
          from pathlib import Path
          b64=''.join(Path(f'.r25-delivery/part{i}.b64').read_text().strip() for i in range(6))
          raw=base64.b64decode(b64,validate=True)
          assert hashlib.sha256(raw).hexdigest()=='81b65d6b3f1e430f7bd16fe580976ba02f88d82ffaf581f9e0c6e63ec37053e9'
          r=Path('revisions/or-r25-20260923')
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:xz') as t:
              assert len(t.getmembers())==20
              for m in t.getmembers():
                  p=Path(m.name)
                  assert m.isfile() and p.is_relative_to(r) and '..' not in p.parts
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(t.extractfile(m).read())
          for d in ('predecessor','results','tables'): (r/d).mkdir(exist_ok=True)
          print('Verified the complete R25 source overlay.')
          PY
          python revisions/or-r25-20260923/materialize_revision.py
      - name: Install pinned numerical and PDF dependencies
        run: |
          python -m pip install -r revisions/or-r25-20260923/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-extra texlive-fonts-recommended texlive-plain-generic poppler-utils
      - name: Execute exact structural and promised-state tests
        run: |
          python revisions/or-r25-20260923/structural_checks.py
          python -S revisions/or-r25-20260923/promise_checks.py
      - name: Execute all three new studies on the committed source
        run: |
          python revisions/or-r25-20260923/study.py all
          python - <<'PY'
          import json,os,platform,sys
          from pathlib import Path
          import numpy,scipy,casadi,sympy,fitz
          p=Path('revisions/or-r25-20260923/results/EXECUTION_PROVENANCE.json')
          p.write_text(json.dumps({'source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'python':sys.version,'platform':platform.platform(),'numpy':numpy.__version__,'scipy':scipy.__version__,'casadi':casadi.__version__,'sympy':sympy.__version__,'pymupdf':fitz.VersionBind,'threads':1,'source_overlay_sha256':'81b65d6b3f1e430f7bd16fe580976ba02f88d82ffaf581f9e0c6e63ec37053e9','studies_executed_sequentially':True,'inherited_timing_evidence':'R24 archived measurements; not rerun or relabeled as R25 timings'},indent=2)+'\n')
          PY
      - name: Independently replay new and inherited rational evidence
        run: |
          R=revisions/or-r25-20260923
          python -S "$R/replay.py"
          python -S revisions/or-r24-20260923/replay.py --check > "$R/results/inherited_r24_replay.json"
          python -S revisions/or-r24-20260923/transfer_checks.py
          cp revisions/or-r24-20260923/results/transfer_checks.json "$R/results/inherited_transfer_checks.json"
          python -S revisions/or-r23-20260923/replay.py --check
          python -S revisions/or-r22-20260923/replay.py --check
          python -S revisions/or-r22-20260923/complete_dual_checks.py --check
          python -S revisions/or-r19-20260923/replay.py --check
      - name: Build and validate the actual complete manuscripts
        run: |
          R=revisions/or-r25-20260923
          bash "$R/build.sh"
          python "$R/check_package.py"
          python "$R/check_package.py" --manifest
          python "$R/check_package.py" --verify-manifest
      - name: Publish only the complete R25 branch
        id: publish
        run: |
          test "$(git branch --show-current)" = "$REVISION_BRANCH"
          python - <<'PY'
          import subprocess
          allowed={'main.tex','main.pdf','main.bib','electronic_companion.tex','electronic_companion.pdf','README.md','NDU_OR_submission_checklist.md','r25-main-labels.aux','r25-ec-labels.aux'}
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert all(p in allowed or p.startswith('revisions/or-r25-20260923/') for p in changed),changed
          print('Earlier revisions, referee reports, computational and historical supplements remain unchanged.')
          PY
          git fetch origin "$REVISION_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git config user.name 'NDU R25 revision'
          git config user.email 'ndu-revision@users.noreply.github.com'
          git rm -r .r25-delivery
          find revisions/or-r25-20260923 -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -f revisions/or-r25-20260923 main.tex main.pdf main.bib electronic_companion.tex electronic_companion.pdf README.md NDU_OR_submission_checklist.md r25-main-labels.aux r25-ec-labels.aux
          git commit -m 'paper(or-r25): optimized restriction-release theory, comparator rents, promised-state recursion, audited hierarchy and reusable bounds'
          git push origin "HEAD:refs/heads/$REVISION_BRANCH"
          final_sha=$(git rev-parse HEAD)
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "$final_sha" > /tmp/R25_FINAL_SHA.txt
          git archive --format=tar.gz -o /tmp/NDU_OR_R25_review_package.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ndu-or-r25-complete-review-package
          path: |
            /tmp/NDU_OR_R25_review_package.tar.gz
            /tmp/R25_FINAL_SHA.txt
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ndu-or-r25-build-diagnostics
          path: revisions/or-r25-20260923/results/
          retention-days: 14
          if-no-files-found: warn
  validate-final:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.final_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Mark the actual final SHA pending independent verification
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/${{ needs.publish.outputs.final_sha }}" -f state=pending -f context=ndu-or-r25/final-sha -f description='Independent checkout, rational replay, PDF and hash verification' -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Independently verify the actual published files
        run: |
          python -m pip install PyMuPDF==1.26.7
          test "$(git rev-parse HEAD)" = '${{ needs.publish.outputs.final_sha }}'
          test ! -d .r25-delivery
          python -S revisions/or-r25-20260923/replay.py --check
          python -S revisions/or-r24-20260923/replay.py --check
          python -S revisions/or-r23-20260923/replay.py --check
          python -S revisions/or-r22-20260923/replay.py --check
          python -S revisions/or-r22-20260923/complete_dual_checks.py --check
          python -S revisions/or-r19-20260923/replay.py --check
          python revisions/or-r25-20260923/check_package.py --verify-manifest
          git diff --exit-code
      - name: Attach verification status to the actual final commit
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          [ "$JOB_STATUS" = success ] && state=success
          gh api "repos/$GITHUB_REPOSITORY/statuses/${{ needs.publish.outputs.final_sha }}" -f state="$state" -f context=ndu-or-r25/final-sha -f description='Actual final-SHA exact replay, preservation, PDF and manifest checks' -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
