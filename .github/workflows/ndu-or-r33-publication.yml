name: NDU R33 scientific revision and reader build
on:
  push:
    branches: [revision/ndu-operations-research-r33-piecewise-randomized-20260923]
    paths:
      - '.github/workflows/ndu-or-r33-publication.yml'
      - 'main.tex'
      - 'electronic_companion.tex'
      - 'revisions/or-r33-piecewise-randomized-20260923/*.py'
      - 'revisions/or-r33-piecewise-randomized-20260923/*.tex'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ndu-or-r33-publication
  cancel-in-progress: false
env:
  REVISION_BRANCH: revision/ndu-operations-research-r33-piecewise-randomized-20260923
  R: revisions/or-r33-piecewise-randomized-20260923
jobs:
  revise-build-publish:
    if: github.ref == 'refs/heads/revision/ndu-operations-research-r33-piecewise-randomized-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare tracked reader sources without deleting scientific content
        run: python "$R/prepare_reader.py"
      - name: Execute exact rational verification and retained tightness check
        run: |
          python "$R/verify.py"
          python revisions/or-r31-tightness-minimal-machine-20260923/tightness_check.py
      - name: Commit the exact source and test snapshot
        run: |
          test "$(git branch --show-current)" = "$REVISION_BRANCH"
          git config user.name 'NDU revision build'
          git config user.email 'ndu-revision@users.noreply.github.com'
          git add main.tex electronic_companion.tex README.md NDU_OR_submission_checklist.md "$R"
          if ! git diff --cached --quiet; then
            git commit -m 'paper(or-r33): retain full proofs and collect unchanged tables in regular-length reader'
            git push origin "HEAD:refs/heads/$REVISION_BRANCH"
          fi
      - name: Install reader-build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-extra texlive-fonts-recommended texlive-plain-generic texlive-science poppler-utils
      - name: Compile and validate both reader documents
        run: python "$R/build_validate.py"
      - name: Publish validated reader PDFs on the isolated branch
        run: |
          test "$(git branch --show-current)" = "$REVISION_BRANCH"
          git add -f main.pdf electronic_companion.pdf r33-main-labels.aux r33-ec-labels.aux "$R/BUILD_VALIDATION.json"
          if ! git diff --cached --quiet; then
            git commit -m 'paper(or-r33): publish validated 30-page article and electronic companion'
            git push origin "HEAD:refs/heads/$REVISION_BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ndu-or-r33-reader-build
          include-hidden-files: true
          path: |
            main.tex
            electronic_companion.tex
            main.pdf
            electronic_companion.pdf
            README.md
            NDU_OR_submission_checklist.md
            r33-main-labels.aux
            r33-ec-labels.aux
            revisions/or-r33-piecewise-randomized-20260923/
            revisions/or-r31-tightness-minimal-machine-20260923/*.tex
            revisions/or-r32-priority-complexity-closure-20260923/*.tex
            .build/ndu-r33/
            !revisions/**/__pycache__/**
          retention-days: 30
          if-no-files-found: warn
