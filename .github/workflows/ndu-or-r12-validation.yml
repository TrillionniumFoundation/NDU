name: NDU OR R12 scientific revision
on:
  push:
    branches: [revision/ndu-operations-research-r12-20260922]
    paths: [.r12-transport/READY.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ndu-or-r12-scientific-publication
  cancel-in-progress: false
jobs:
  reproduce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REVISION_BRANCH: revision/ndu-operations-research-r12-20260922
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: revision/ndu-operations-research-r12-20260922
      - name: Materialize verified ordinary sources and preserve inherited PDFs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$REVISION_BRANCH"
          git config user.name 'NDU R12 scientific revision'
          git config user.email 'ndu-revision@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import json, base64, lzma, hashlib, subprocess
          ready=json.loads(Path('.r12-transport/READY.json').read_text())
          subprocess.run(['git','merge-base','--is-ancestor',ready['parent'],'HEAD'],check=True)
          parts=sorted(Path('.r12-transport').glob('part-*.b64'))
          assert len(parts)==ready['parts'], 'Incomplete R12 source payload'
          packed=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
          assert hashlib.sha256(packed).hexdigest()==ready['sha256'], 'R12 payload hash mismatch'
          sources=json.loads(lzma.decompress(packed))
          roots={'main.tex','electronic_companion.tex','historical_supplement.tex','README.md'}
          for name,text in sources.items():
              path=PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name in roots or name.startswith('revisions/or-r12-20260922/')
              target=Path(name);target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(text,encoding='utf-8')
          pred=Path('revisions/or-r12-20260922/predecessor')
          expected=json.loads((pred/'PDF_SHA256.json').read_text())
          for name,digest in expected.items():
              data=subprocess.check_output(['git','show',ready['parent']+':'+name])
              assert hashlib.sha256(data).hexdigest()==digest, 'Unexpected predecessor PDF'
              (pred/name).write_bytes(data)
          print('Materialized',len(sources),'ordinary sources; inherited PDFs preserved exactly')
          PY
          git add main.tex electronic_companion.tex historical_supplement.tex README.md revisions/or-r12-20260922
          git commit -m 'paper(or-r12): integrate full-tree capacity theory, acceptance-face learning and complete referee response'
          git push origin HEAD:"refs/heads/$REVISION_BRANCH"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install numerical and typesetting dependencies
        run: |
          python -m pip install -r revisions/or-r12-20260922/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-extra texlive-fonts-recommended texlive-plain-generic poppler-utils
      - name: Reproduce experiments and independently verify all reported certificates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p revisions/or-r12-20260922/results
          bash revisions/or-r12-20260922/reproduce.sh 2>&1 | tee /tmp/ndu-r12-reproduce.log
          cp /tmp/ndu-r12-reproduce.log revisions/or-r12-20260922/results/ci-reproduce.log
      - name: Compile manuscript, current companion, and preserved archive
        shell: bash
        run: |
          set -euo pipefail
          bash revisions/or-r12-20260922/build.sh 2>&1 | tee /tmp/ndu-r12-build.log
          cp /tmp/ndu-r12-build.log revisions/or-r12-20260922/results/ci-build.log
          python revisions/or-r12-20260922/manifest.py
      - name: Publish actual PDFs and full results on this revision branch only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$REVISION_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          python - <<'PY'
          import subprocess
          allowed={'README.md','main.tex','main.pdf','electronic_companion.tex','electronic_companion.pdf','historical_supplement.tex','historical_supplement.pdf'}
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert all(n in allowed or n.startswith('revisions/or-r12-20260922/') for n in changed), changed
          PY
          git add -f main.pdf electronic_companion.pdf historical_supplement.pdf revisions/or-r12-20260922
          if ! git diff --cached --quiet; then
            git commit -m 'build(or-r12): publish replayed certificates, full diagnostics and compiled revision [skip ci]'
            git push origin HEAD:"refs/heads/$REVISION_BRANCH"
          fi
          git rev-parse HEAD > /tmp/R12_REVIEWED_COMMIT.txt
          git archive --format=tar.gz HEAD > /tmp/NDU_OR_R12_review_package.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ndu-or-r12-scientific-review-package
          retention-days: 30
          path: |
            /tmp/NDU_OR_R12_review_package.tar.gz
            /tmp/R12_REVIEWED_COMMIT.txt
            main.pdf
            electronic_companion.pdf
            historical_supplement.pdf
            main.log
            electronic_companion.log
            historical_supplement.log
            /tmp/ndu-r12-*.log
            revisions/or-r12-20260922/results/verification.json
            revisions/or-r12-20260922/results/package_checks.json
          if-no-files-found: warn
