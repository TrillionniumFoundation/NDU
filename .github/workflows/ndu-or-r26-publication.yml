name: NDU OR R26 continuous-state revision and final-SHA validation
on:
  push:
    branches: [revision/ndu-operations-research-r26-20260923]
    paths: [.github/workflows/ndu-or-r26-publication.yml]
permissions:
  contents: write
  statuses: write
  actions: read
concurrency:
  group: ndu-or-r26-publication
  cancel-in-progress: true
env:
  REVISION_BRANCH: revision/ndu-operations-research-r26-20260923
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  GH_TOKEN: ${{ github.token }}
jobs:
  publish:
    if: github.ref == 'refs/heads/revision/ndu-operations-research-r26-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      final_sha: ${{ steps.publish.outputs.final_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify complete source overlay and preserve R25
        run: |
          python - <<'PY'
          import base64,hashlib,io,tarfile
          from pathlib import Path
          raw=base64.b64decode(''.join(Path(f'.r26-delivery/part{i}.b64').read_text().strip() for i in range(4)),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='a9c72d06754b7271eb34a6e0aa361722846b901fc1122dd0679cc7c948dad4ba'
          r=Path('revisions/or-r26-20260923')
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:xz') as t:
              assert len(t.getmembers())==17
              for m in t.getmembers():
                  p=Path(m.name)
                  assert m.isfile() and p.is_relative_to(r) and '..' not in p.parts
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(t.extractfile(m).read())
          PY
          test "$(git hash-object reviews/operation_research_referee_report_r24_independent_2026-09-23.md)" = 4f45f76715936234d9f5738f798dd9e4f3b2dc4a
          python revisions/or-r26-20260923/materialize_revision.py
      - name: Install pinned proposal and PDF dependencies
        run: |
          python -m pip install -r revisions/or-r26-20260923/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-extra texlive-fonts-recommended texlive-plain-generic poppler-utils
      - name: Generate and independently verify continuous-state certificates
        run: |
          R=revisions/or-r26-20260923
          bash "$R/regenerate.sh"
          python - <<'PY'
          import json,os,platform,sys,numpy,scipy,fitz
          from pathlib import Path
          Path('revisions/or-r26-20260923/results/EXECUTION_PROVENANCE.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'source_base_sha':'7f3f12c9d412b45a570725dc9b61203d64da5e41','run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'python':sys.version,'platform':platform.platform(),'numpy':numpy.__version__,'scipy':scipy.__version__,'pymupdf':fitz.VersionBind,'threads':1,'source_overlay_sha256':'a9c72d06754b7271eb34a6e0aa361722846b901fc1122dd0679cc7c948dad4ba','new_evidence':'six continuous-tier Markov envelope designs and exact omitted-state examples','inherited_evidence':'R25/R24 unchanged; replayed, not regenerated or attributed to R26'},indent=2)+'\n')
          PY
      - name: Replay inherited scientific evidence without changing it
        run: |
          R=revisions/or-r26-20260923
          python -S revisions/or-r25-20260923/replay.py --check > "$R/results/inherited_r25_replay.json"
          python -S revisions/or-r24-20260923/replay.py --check > "$R/results/inherited_r24_replay.json"
      - name: Build and check the complete current paper and companion
        run: |
          R=revisions/or-r26-20260923
          bash "$R/build.sh"
          python "$R/check_package.py"
          python "$R/check_package.py" --manifest
          python "$R/check_package.py" --verify-manifest
      - name: Publish only the new revision branch
        id: publish
        run: |
          test "$(git branch --show-current)" = "$REVISION_BRANCH"
          python - <<'PY'
          import subprocess
          allowed={'main.tex','main.pdf','main.bib','electronic_companion.tex','electronic_companion.pdf','README.md','NDU_OR_submission_checklist.md','r26-main-labels.aux','r26-ec-labels.aux'}
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert all(p in allowed or p.startswith('revisions/or-r26-20260923/') for p in changed),changed
          print('No earlier revision, review, computational or historical document modified.')
          PY
          git fetch origin "$REVISION_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git config user.name 'NDU R26 revision'
          git config user.email 'ndu-revision@users.noreply.github.com'
          git rm -r .r26-delivery
          find revisions/or-r26-20260923 -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -f revisions/or-r26-20260923 main.tex main.pdf main.bib electronic_companion.tex electronic_companion.pdf README.md NDU_OR_submission_checklist.md r26-main-labels.aux r26-ec-labels.aux
          git commit -m 'paper(or-r26): continuous promised-state certificates, omitted-state value, and complete response to both R24 reports'
          git push origin "HEAD:refs/heads/$REVISION_BRANCH"
          final_sha=$(git rev-parse HEAD)
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "$final_sha" > /tmp/R26_FINAL_SHA.txt
          git archive --format=tar.gz -o /tmp/NDU_OR_R26_review_package.tar.gz HEAD
          mkdir -p /tmp/ndu-r26-reader
          cp main.pdf electronic_companion.pdf /tmp/ndu-r26-reader/
          cp revisions/or-r26-20260923/RESPONSE_TO_REFEREES.md revisions/or-r26-20260923/MANIFEST.json revisions/or-r26-20260923/results/package_check.json revisions/or-r26-20260923/results/replay.json /tmp/ndu-r26-reader/
          cp /tmp/R26_FINAL_SHA.txt /tmp/ndu-r26-reader/
      - uses: actions/upload-artifact@v4
        with:
          name: ndu-or-r26-complete-review-package
          path: |
            /tmp/NDU_OR_R26_review_package.tar.gz
            /tmp/R26_FINAL_SHA.txt
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ndu-or-r26-reader-files
          path: /tmp/ndu-r26-reader/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ndu-or-r26-build-diagnostics
          path: revisions/or-r26-20260923/results/
          retention-days: 14
          if-no-files-found: warn
  validate-final:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.final_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Mark the actual final scientific SHA pending validation
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/${{ needs.publish.outputs.final_sha }}" -f state=pending -f context=ndu-or-r26/final-sha -f description='Independent final checkout, rational replay, PDF and hash verification' -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Independently verify the published scientific commit
        run: |
          python -m pip install PyMuPDF==1.26.7
          test "$(git rev-parse HEAD)" = '${{ needs.publish.outputs.final_sha }}'
          test ! -d .r26-delivery
          test "$(git hash-object reviews/operation_research_referee_report_r24_independent_2026-09-23.md)" = 4f45f76715936234d9f5738f798dd9e4f3b2dc4a
          python -S revisions/or-r26-20260923/replay.py --check
          python -S revisions/or-r25-20260923/replay.py --check
          python -S revisions/or-r24-20260923/replay.py --check
          python revisions/or-r26-20260923/check_package.py
          python revisions/or-r26-20260923/check_package.py --verify-manifest
          git diff --exit-code
      - name: Attach final-SHA verification result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          [ "$JOB_STATUS" = success ] && state=success
          gh api "repos/$GITHUB_REPOSITORY/statuses/${{ needs.publish.outputs.final_sha }}" -f state="$state" -f context=ndu-or-r26/final-sha -f description='Actual final-SHA replay, predecessor preservation, PDFs and manifest' -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
