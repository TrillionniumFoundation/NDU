name: NDU Operations Research R66 editorial receipt scope
on:
  push:
    branches: [revision/ndu-operations-research-r66-editorial-scope-20260927]
    paths: ['.github/workflows/ndu-or-r66-complete.yml', '.r66-source/**']
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
concurrency:
  group: ndu-or-r66-editorial-scope
  cancel-in-progress: true
env:
  REV: revisions/or-r66-editorial-scope-20260927
  GH_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Pin accepted source and governing report and materialize complete R66 sources
        run: python .r66-source/driver.py source
      - name: Install pinned numerical and complete manuscript dependencies
        run: |
          python -m pip install -r "$REV/requirements.txt"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-plain-generic tex-gyre > "$RUNNER_TEMP/r66-tex-install.log" 2>&1
          kpsewhich newtxtext.sty
          kpsewhich newtxmath.sty
          kpsewhich binhex.tex
          dpkg-query -W 'texlive*' tex-gyre > "$REV/results/r66/TEX_TOOLCHAIN66.txt"
          python -m pip freeze > "$REV/results/r66/PYTHON_PACKAGES66.txt"
      - name: Execute scope and retained regressions, rebuild readers and replay all frozen proofs
        run: python "$REV/qualify66.py"
      - name: Publish complete editorial revision on this new branch only
        run: python .r66-source/driver.py publish
      - name: Read-only verification and fresh proof replay on the actual published SHA
        run: python .r66-source/driver.py exact
      - name: Publish complete referee package and exact-head receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-or-r66-referee-package-and-exact-head-receipt
          retention-days: 30
          if-no-files-found: error
          path: |
            CURRENT_SUBMISSION.zip
            ${{ runner.temp }}/R66_EXACT_HEAD_RECEIPT.json
            ${{ runner.temp }}/r66-exact-check.json
            ${{ runner.temp }}/r66-exact-replay/REQUEST_REPLAY65.json
            ${{ runner.temp }}/r66-exact-replay/REQUEST_RECEIPTS65.jsonl
      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-or-r66-failure-diagnostics
          retention-days: 7
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/r66-tex-install.log
            revisions/or-r66-editorial-scope-20260927/results/r66/
            revisions/or-r66-editorial-scope-20260927/.build/
