name: NDU OR R4 scientific build
on:
  push:
    branches: ['revision/ndu-operations-research-r4-20260920']
    paths:
      - '.github/workflows/ndu-or-r4-build.yml'
      - 'main.tex'
      - 'electronic_companion.tex'
      - 'revisions/or-r4-20260920/sections/**'
      - 'revisions/or-r4-20260920/*.py'
      - 'revisions/or-r4-20260920/build.sh'
permissions:
  contents: write
concurrency:
  group: ndu-or-r4-scientific-build
  cancel-in-progress: false
jobs:
  scientific-build:
    if: github.ref == 'refs/heads/revision/ndu-operations-research-r4-20260920'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install numerical and TeX dependencies
        run: |
          python -m pip install -r revisions/or-r4-20260920/requirements.txt
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-extra texlive-fonts-recommended
      - name: Execute all scientific checks and build both manuscripts
        run: |
          set -euo pipefail
          bash revisions/or-r4-20260920/build.sh > revisions/or-r4-20260920/ci-build.log 2>&1
          test -s main.pdf
          test -s electronic_companion.pdf
          sha256sum main.pdf electronic_companion.pdf > revisions/or-r4-20260920/pdf-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ndu-or-r4-manuscript-and-executed-results
          path: |
            main.pdf
            electronic_companion.pdf
            revisions/or-r4-20260920/results/
            revisions/or-r4-20260920/ci-build.log
            revisions/or-r4-20260920/pdf-sha256.txt
          retention-days: 30
      - name: Publish compiled PDFs only to the isolated revision branch
        env:
          TARGET_BRANCH: revision/ndu-operations-research-r4-20260920
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          mkdir -p /tmp/ndu-r4-pdfs
          cp main.pdf electronic_companion.pdf /tmp/ndu-r4-pdfs/
          git fetch origin "$TARGET_BRANCH"
          git diff --exit-code "$GITHUB_SHA" FETCH_HEAD -- main.tex electronic_companion.tex revisions/or-r4-20260920/sections/ revisions/or-r4-20260920/execute.py revisions/or-r4-20260920/make_tables.py
          git restore revisions/or-r4-20260920/results/ revisions/or-r4-20260920/tables.tex || true
          git checkout -f -B "$TARGET_BRANCH" FETCH_HEAD
          cp /tmp/ndu-r4-pdfs/main.pdf main.pdf
          cp /tmp/ndu-r4-pdfs/electronic_companion.pdf electronic_companion.pdf
          git config user.name 'NDU R4 build'
          git config user.email 'ndu-r4-build@users.noreply.github.com'
          git add main.pdf electronic_companion.pdf
          git diff --cached --quiet || git commit -m 'build(or-r4): publish compiled revised manuscript and electronic companion'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
