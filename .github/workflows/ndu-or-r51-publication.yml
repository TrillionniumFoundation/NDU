name: NDU R51 selected-book revision publication
on:
  push:
    branches: [revision/ndu-operations-research-r51-selected-book-frontier-20260925]
    paths:
      - '.github/workflows/ndu-or-r51-publication.yml'
      - 'revisions/or-r51-selected-book-frontier-20260925/bootstrap.py'
      - 'revisions/or-r51-selected-book-frontier-20260925/transport/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ndu-or-r51-publication
  cancel-in-progress: false
env:
  BRANCH: revision/ndu-operations-research-r51-selected-book-frontier-20260925
  R: revisions/or-r51-selected-book-frontier-20260925
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  publish:
    if: github.ref == 'refs/heads/revision/ndu-operations-research-r51-selected-book-frontier-20260925'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Validate source payload and preserve the complete reviewed tree
        run: python "$R/bootstrap.py"
      - name: Install pinned numerical and PDF-checking dependencies
        run: |
          python -m pip install -r "$R/requirements.txt"
          python -m pip freeze > "$R/results/ci_python_environment.txt"
      - name: Reproduce all 182 cases and independent regression checks
        run: python "$R/code/publication.py"
      - name: Push readable scientific sources and verified evidence
        run: |
          test "$(git branch --show-current)" = "$BRANCH"
          git config user.name 'NDU revision publication'
          git config user.email 'ndu-revision@users.noreply.github.com'
          git add main.tex electronic_companion.tex "$R"
          git add -f "$R/predecessor/main.pdf" "$R/predecessor/electronic_companion.pdf" "$R/results/certificates"
          if ! git diff --cached --quiet; then
            git commit -m 'paper(or-r51): selected-prefix price bounds, robustness proofs and 182 verified certificates [skip ci]'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
      - name: Install Operations Research reader toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-extra texlive-fonts-recommended texlive-plain-generic texlive-science poppler-utils
      - name: Compile readers and audit all inherited content
        run: |
          python "$R/code/build.py"
          python "$R/code/metadata.py"
      - name: Push validated manuscript companion response and preservation audit
        run: |
          test "$(git branch --show-current)" = "$BRANCH"
          git add main.tex electronic_companion.tex README.md NDU_OR_submission_checklist.md "$R"
          git add -f main.pdf electronic_companion.pdf r51-main-labels.aux r51-ec-labels.aux r51-archive-labels.aux r51-archive-ec-labels.aux r51-archive-cs-labels.aux "$R/main.pdf" "$R/electronic_companion.pdf" "$R/RESPONSE_TO_REFEREES.pdf"
          if ! git diff --cached --quiet; then
            git commit -m 'paper(or-r51): validated OR readers, point-by-point response and complete preservation audit [skip ci]'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/R51_PUBLICATION_COMMIT.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ndu-or-r51-referee-package
          include-hidden-files: true
          path: |
            main.tex
            electronic_companion.tex
            main.pdf
            electronic_companion.pdf
            README.md
            NDU_OR_submission_checklist.md
            r51-*-labels.aux
            revisions/or-r51-selected-book-frontier-20260925/
            reviews/operation_research_referee_report_r49_second_independent_harsh_2026-09-25.md
            !revisions/**/__pycache__/**
          retention-days: 30
          if-no-files-found: error
