name: NDU R43 prefix decomposition publication
on:
  push:
    branches: [revision/ndu-operations-research-r43-prefix-decomposition-20260924]
    paths:
      - '.github/workflows/ndu-or-r43-publication.yml'
      - 'revisions/or-r43-prefix-decomposition-20260924/BUILD'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ndu-or-r43-publication
  cancel-in-progress: false
env:
  BRANCH: revision/ndu-operations-research-r43-prefix-decomposition-20260924
  R: revisions/or-r43-prefix-decomposition-20260924
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  publish:
    if: github.ref == 'refs/heads/revision/ndu-operations-research-r43-prefix-decomposition-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble hash-verified sources on the isolated revision branch
        run: python "$R/assemble.py"
      - name: Install exact and independent nonlinear verification dependencies
        run: |
          python -m pip install sympy scipy pypdf pyscipopt
          mkdir -p "$R/results"
          python -m pip freeze > "$R/results/python_environment.txt"
      - name: Execute exact decomposition witness checks frontier and independent solver comparisons
        run: python "$R/code/build.py" prepare
      - name: Commit scientific sources before reader compilation
        run: |
          test "$(git branch --show-current)" = "$BRANCH"
          git config user.name 'NDU revision publication'
          git config user.email 'ndu-revision@users.noreply.github.com'
          git add main.tex electronic_companion.tex README.md NDU_OR_submission_checklist.md "$R"
          git add -f "$R/predecessor/main.pdf" "$R/predecessor/electronic_companion.pdf"
          if ! git diff --cached --quiet; then
            git commit -m 'paper(or-r43): add prefix-price dynamic programming verified search witnesses and independent global comparisons'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
      - name: Install Operations Research reader toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-extra texlive-fonts-recommended texlive-plain-generic texlive-science poppler-utils
      - name: Compile committed readers and validate full historical preservation
        run: python "$R/code/build.py" build
      - name: Publish validated article companion and referee response
        run: |
          test "$(git branch --show-current)" = "$BRANCH"
          git add -f main.pdf electronic_companion.pdf r43-main-labels.aux r43-ec-labels.aux "$R/RESPONSE_TO_REFEREES.pdf" "$R/BUILD_VALIDATION.json" "$R/PRESERVATION_MANIFEST.json"
          if ! git diff --cached --quiet; then
            git commit -m 'paper(or-r43): publish validated Operations Research readers and complete preservation record'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ndu-or-r43-referee-package
          include-hidden-files: true
          path: |
            main.tex
            electronic_companion.tex
            main.pdf
            electronic_companion.pdf
            README.md
            NDU_OR_submission_checklist.md
            r43-*-labels.aux
            revisions/or-r43-prefix-decomposition-20260924/
            reviews/operation_research_referee_report_r42_independent_harsh_2026-09-24.md
            .build/ndu-r43/
            !revisions/**/__pycache__/**
          retention-days: 30
          if-no-files-found: error
