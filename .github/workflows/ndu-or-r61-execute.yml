name: NDU R61 frozen author-branch execution
on:
  push:
    branches: [revision/ndu-operations-research-r61-robust-tariffs-20260927]
    paths: ['.github/workflows/ndu-or-r61-execute.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ndu-or-r61-author-study
  cancel-in-progress: false
env:
  R: revisions/or-r61-robust-tariffs-20260927
  BRANCH: revision/ndu-operations-research-r61-robust-tariffs-20260927
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  study:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Validate author-only root and exact staged scientific sources
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,os,subprocess
          from pathlib import Path
          roots=subprocess.check_output(['git','rev-list','--max-parents=0','HEAD'],text=True).split()
          assert roots==['447eb4ca5783720a14d1135ea7022eae35ab4a7e'],roots
          r=Path(os.environ['R']);p=json.loads((r/'PROVENANCE.json').read_text())
          assert p['scientific_source_commit']=='b6833bc77786db5902b5562f985f2201de58e40f'
          raw=base64.b64decode(''.join(x.read_text().strip() for x in sorted(Path('.r61-transport').glob('study.part*'))),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='92b44def6c7d85f5b24423be5520f6ae4c849d7fe9006bf64f060cec5475b7d8'
          for name,text in json.loads(lzma.decompress(raw)).items():
              assert (r/name).read_text()==text,('Execution source differs',name)
          print('Author root and execution closure verified')
          PY
      - name: Install pinned scientific dependencies
        run: python -m pip install -r "$R/requirements.txt"
      - name: Structural regressions and prospective source freeze
        run: |
          mkdir -p "$R/results" "$R/generated"
          python "$R/code/tests60.py" --output "$R/results/INHERITED_STRUCTURAL60.json"
          python "$R/code/tests61.py" --output "$R/results/STRUCTURAL61.json"
          python "$R/code/study61.py" freeze
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$R/results"
          git diff --cached --quiet || git commit -m 'evidence(or-r61): freeze exact sources and all prospective inputs before timing [skip ci]'
          git push origin "HEAD:refs/heads/$BRANCH"
          if [ ! -f "$R/results/SOURCE_FREEZE_COMMIT.txt" ]; then git rev-parse HEAD > "$R/results/SOURCE_FREEZE_COMMIT.txt"; fi
      - name: Execute complete declared study without replacing finished evidence
        run: python "$R/code/study61.py" run
      - name: Independently recheck completed certificates
        run: python "$R/code/study61.py" verify
      - name: Publish execution outcomes including failures and limits
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$R/results" "$R/generated"
          git diff --cached --quiet || git commit -m 'evidence(or-r61): retain complete scaling records and independent certificate checks [skip ci]'
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Export execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-or-r61-executed-study
          include-hidden-files: true
          retention-days: 30
          path: revisions/or-r61-robust-tariffs-20260927/
