name: NDU Operations Research R65 request and transfer closure
on:
  push:
    branches: [revision/ndu-operations-research-r65-request-transfer-20260927]
    paths: ['.github/workflows/ndu-or-r65-complete.yml', '.r65-source/**']
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
concurrency:
  group: ndu-or-r65-request-transfer
  cancel-in-progress: false
env:
  REV: revisions/or-r65-request-transfer-20260927
  GH_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Pin reviewed source and report and materialize direct R65 sources
        run: python .r65-source/driver.py source
      - name: Install pinned numerical and complete manuscript dependencies
        run: |
          python -m pip install -r "$REV/requirements.txt"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-plain-generic tex-gyre > "$RUNNER_TEMP/r65-tex-install.log" 2>&1
          kpsewhich newtxtext.sty
          kpsewhich newtxmath.sty
          kpsewhich binhex.tex
          dpkg-query -W 'texlive*' tex-gyre > "$REV/results/r65/TEX_TOOLCHAIN65.txt"
          python -m pip freeze > "$REV/results/r65/PYTHON_PACKAGES65.txt"
      - name: Execute request, transfer and retained regressions, build readers and replay frozen proofs
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['REV'])/'revise65.py'
          source=p.read_text()
          old='Theorem~6 and its perturbation proof'
          assert source.count(old)==1
          p.write_text(source.replace(old,'Theorem~6.1 and its perturbation proof'))
          PY
          python "$REV/qualify65.py"
      - name: Publish complete revision and readers on this new branch only
        run: python .r65-source/driver.py publish
      - name: Read-only check and fresh 389-proof replay on actual published SHA
        run: python .r65-source/driver.py exact
      - name: Publish complete referee package and exact-head receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-or-r65-referee-package-and-exact-head-receipt
          retention-days: 30
          if-no-files-found: error
          path: |
            CURRENT_SUBMISSION.zip
            ${{ runner.temp }}/R65_EXACT_HEAD_RECEIPT.json
            ${{ runner.temp }}/r65-exact-check.json
            ${{ runner.temp }}/r65-exact-replay/REQUEST_REPLAY65.json
            ${{ runner.temp }}/r65-exact-replay/REQUEST_RECEIPTS65.jsonl
      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-or-r65-failure-diagnostics
          retention-days: 7
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/r65-tex-install.log
            revisions/or-r65-request-transfer-20260927/results/r65/
            revisions/or-r65-request-transfer-20260927/.build/
