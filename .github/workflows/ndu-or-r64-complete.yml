name: NDU Operations Research R64 complete revision
on:
  push:
    branches: [revision/ndu-operations-research-r64-certificate-closure-20260927]
    paths: ['.github/workflows/ndu-or-r64-complete.yml', '.r64-source/**']
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
concurrency:
  group: ndu-or-r64-certificate-closure
  cancel-in-progress: false
env:
  REV: revisions/or-r64-certificate-closure-20260927
  GH_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Pin author and reviewer identities and materialize direct R64 sources
        run: python .r64-source/driver.py source
      - name: Install numerical and complete manuscript dependencies
        run: |
          python -m pip install -r "$REV/requirements.txt"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-plain-generic tex-gyre > "$RUNNER_TEMP/r64-tex-install.log" 2>&1
          kpsewhich newtxtext.sty
          kpsewhich newtxmath.sty
          kpsewhich binhex.tex
          dpkg-query -W 'texlive*' tex-gyre > "$REV/results/r64/TEX_TOOLCHAIN64.txt"
          python -m pip freeze > "$REV/results/r64/PYTHON_PACKAGES64.txt"
      - name: Execute semantic and historical regressions, frozen-table reconstruction and full proof replay
        run: python "$REV/qualify64.py"
      - name: Publish complete readers, direct sources, proofs and preservation map to this new branch
        run: python .r64-source/driver.py publish
      - name: Read-only verification and independent 389-proof replay on the actual published SHA
        run: python .r64-source/driver.py exact
      - name: Publish complete referee package and exact-head receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-or-r64-referee-package-and-exact-head-receipt
          retention-days: 30
          if-no-files-found: error
          path: |
            CURRENT_SUBMISSION.zip
            ${{ runner.temp }}/R64_EXACT_HEAD_RECEIPT.json
            ${{ runner.temp }}/r64-exact-check.json
            ${{ runner.temp }}/r64-exact-replay/BINDING_REPLAY.json
            ${{ runner.temp }}/r64-exact-replay/BINDING_RECEIPTS.jsonl
      - name: Preserve actual diagnostic evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ndu-or-r64-failure-diagnostics
          retention-days: 7
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/r64-tex-install.log
            revisions/or-r64-certificate-closure-20260927/results/r64/
            revisions/or-r64-certificate-closure-20260927/.build/
