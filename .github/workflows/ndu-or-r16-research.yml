name: NDU OR R16 complete frozen research
on:
  push:
    branches: [revision/ndu-operations-research-r16-20260922]
    paths: [.r16-research/READY.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ndu-or-r16-research
  cancel-in-progress: false
jobs:
  reproduce:
    if: github.ref == 'refs/heads/revision/ndu-operations-research-r16-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      REVISION_BRANCH: revision/ndu-operations-research-r16-20260922
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize the numerically amended sources without changing R15
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$REVISION_BRANCH"
          python - <<'PY'
          from pathlib import Path
          import json, hashlib
          old=Path('revisions/or-r15-20260922'); new=Path('revisions/or-r16-20260922')
          amendment=json.loads((new/'AMENDMENT.json').read_text())
          for src in old.iterdir():
              if src.suffix not in ('.py','.c') and src.name not in ('requirements.txt','EXPERIMENT_PLAN.json'): continue
              text=src.read_text()
              if src.suffix=='.py': text=text.replace('R15','R16').replace('r15','r16')
              if src.name=='osqp_bridge.c':
                  assert 'max_iter=50000' in text
                  text=text.replace('max_iter=50000','max_iter=500000')
              if src.name in amendment['source_sha256']:
                  assert hashlib.sha256(text.encode()).hexdigest()==amendment['source_sha256'][src.name],src.name
              (new/src.name).write_text(text)
          (new/'results').mkdir(exist_ok=True)
          PY
          git config user.name 'NDU R16 revision'
          git config user.email 'ndu-revision@users.noreply.github.com'
          git add revisions/or-r16-20260922
          git commit -m 'research(or-r16): freeze ordinary amended sources before the independent reproduction'
          git push origin HEAD:"refs/heads/$REVISION_BRANCH"
          git rev-parse HEAD > /tmp/R16_RESEARCH_SOURCE_SHA.txt
      - name: Install the pinned numerical environment
        run: python -m pip install -r revisions/or-r16-20260922/requirements.txt
      - name: Structural tests, every training cohort, every star stratum, and independent replay
        shell: bash
        run: |
          set -euo pipefail
          R=revisions/or-r16-20260922
          python "$R/structural_tests.py" 2>&1 | tee "$R/results/structural.log"
          python "$R/study.py" 2>&1 | tee "$R/results/study.log"
          python "$R/star_reassessment.py" 2>&1 | tee "$R/results/star.log"
          python -S "$R/verify.py" 2>&1 | tee "$R/results/verify.log"
          cp /tmp/R16_RESEARCH_SOURCE_SHA.txt "$R/results/SOURCE_SHA.txt"
          printf 'PASS\n' > "$R/results/EXECUTION_COMPLETE"
      - name: Publish all observations only to R16
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import gzip
          root=Path('revisions/or-r16-20260922/results')
          for name in ('policies.jsonl','structural_records.json'):
              p=root/name
              if p.exists() and p.stat().st_size>10_000_000:
                  with p.open('rb') as src, (root/(name+'.gz')).open('wb') as out:
                      with gzip.GzipFile(filename='',mode='wb',fileobj=out,mtime=0) as dest:
                          while chunk:=src.read(1048576):dest.write(chunk)
                  p.unlink()
          PY
          git add revisions/or-r16-20260922/results
          git commit -m 'research(or-r16): publish every cohort and stress stratum with independent rational replay'
          git pull --rebase origin "$REVISION_BRANCH"
          git push origin HEAD:"refs/heads/$REVISION_BRANCH"
          git rev-parse HEAD > /tmp/R16_RESEARCH_RESULTS_SHA.txt
          git archive --format=tar.gz HEAD > /tmp/NDU_OR_R16_research.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ndu-or-r16-complete-research
          path: |
            /tmp/NDU_OR_R16_research.tar.gz
            /tmp/R16_RESEARCH_SOURCE_SHA.txt
            /tmp/R16_RESEARCH_RESULTS_SHA.txt
            revisions/or-r16-20260922/results
          retention-days: 30
