name: NDU R34 global randomized frontier and reader build
on:
  push:
    branches: [revision/ndu-operations-research-r34-global-randomized-frontier-20260923]
    paths:
      - '.github/workflows/ndu-or-r34-publication.yml'
      - '.r34-transport/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ndu-or-r34-publication
  cancel-in-progress: false
env:
  REVISION_BRANCH: revision/ndu-operations-research-r34-global-randomized-frontier-20260923
  R: revisions/or-r34-global-randomized-frontier-20260923
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  revise-build-publish:
    if: github.ref == 'refs/heads/revision/ndu-operations-research-r34-global-randomized-frontier-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize hash-verified scientific sources and preserve predecessor wrappers
        run: |
          test "$(git branch --show-current)" = "$REVISION_BRANCH"
          python - <<'PY'
          import base64,hashlib,json,lzma,os,subprocess
          from pathlib import Path,PurePosixPath
          base='38b3f264e371758054d94a9f94088ae17a816241'
          rev=Path(os.environ['R'])
          parts=sorted(Path('.r34-transport').glob('part*.b64'))
          assert [p.name for p in parts]==[f'part{i:02d}.b64' for i in range(10)]
          raw=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
          digest=hashlib.sha256(raw).hexdigest()
          assert digest=='7eedc3b25e87ba55243a460fa7a7d17da4ef557628515e65cc69beb71a9ccc44'
          files=json.loads(lzma.decompress(raw))['files']
          wrappers=['main.tex','electronic_companion.tex','README.md','NDU_OR_submission_checklist.md']
          assert len(files)==17
          (rev/'predecessor').mkdir(parents=True,exist_ok=True)
          for name in wrappers:
              original=subprocess.check_output(['git','show',f'{base}:{name}'])
              (rev/'predecessor'/name).write_bytes(original)
          for name,content in files.items():
              path=PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name in wrappers or str(path).startswith(str(rev)+'/')
              assert isinstance(content,str)
              target=Path(name)
              assert not target.is_symlink()
              assert not any(p.is_symlink() for p in target.parents)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(content,encoding='utf-8')
          record={'compressed_sha256':digest,'base_commit':base,'source_files':{n:hashlib.sha256(c.encode()).hexdigest() for n,c in files.items()}}
          (rev/'SOURCE_PAYLOAD_MANIFEST.json').write_text(json.dumps(record,indent=2)+'\n')
          print('Verified and materialized',len(files),'scientific files; archived four original wrappers.')
          PY
      - name: Run new exact frontier checks and reproduce retained R33 verification without mutation
        run: |
          python "$R/verify.py"
          python "$R/reproduce_inherited.py"
      - name: Commit and publish the exact scientific source and test snapshot
        run: |
          test "$(git branch --show-current)" = "$REVISION_BRANCH"
          git config user.name 'NDU revision build'
          git config user.email 'ndu-revision@users.noreply.github.com'
          git add main.tex electronic_companion.tex README.md NDU_OR_submission_checklist.md "$R"
          if ! git diff --cached --quiet; then
            git commit -m 'paper(or-r34): prove global randomized frontier and all-budget pathwise equivalence with exact checks'
            git push origin "HEAD:refs/heads/$REVISION_BRANCH"
          fi
      - name: Install reader-build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-extra texlive-fonts-recommended texlive-plain-generic texlive-science poppler-utils
      - name: Compile paired reader documents and validate source identity, preservation, and layout
        run: python "$R/build_validate.py"
      - name: Publish validated reader PDFs on the isolated revision branch
        run: |
          test "$(git branch --show-current)" = "$REVISION_BRANCH"
          git add -f main.pdf electronic_companion.pdf r34-main-labels.aux r34-ec-labels.aux "$R/BUILD_VALIDATION.json"
          if ! git diff --cached --quiet; then
            git commit -m 'paper(or-r34): publish validated 36-page article and 17-page electronic companion'
            git push origin "HEAD:refs/heads/$REVISION_BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ndu-or-r34-reader-build
          include-hidden-files: true
          path: |
            main.tex
            electronic_companion.tex
            main.pdf
            electronic_companion.pdf
            README.md
            NDU_OR_submission_checklist.md
            r34-main-labels.aux
            r34-ec-labels.aux
            revisions/or-r34-global-randomized-frontier-20260923/
            revisions/or-r31-tightness-minimal-machine-20260923/*.tex
            revisions/or-r32-priority-complexity-closure-20260923/*.tex
            revisions/or-r33-piecewise-randomized-20260923/
            .build/ndu-r34/
            !revisions/**/__pycache__/**
          retention-days: 30
          if-no-files-found: warn
