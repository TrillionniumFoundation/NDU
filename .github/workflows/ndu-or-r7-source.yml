name: NDU R7 source snapshot
on:
  push:
    branches: [revision/ndu-operations-research-r7-20260921]
    paths: [.github/workflows/ndu-or-r7-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export reviewed source
        run: git archive --format=tar.gz -o reviewed-source.tar.gz 31c8d31b8041f19b89dcac8193d0e0dcccbdcbe8
      - uses: actions/upload-artifact@v4
        with:
          name: ndu-r7-reviewed-source
          path: reviewed-source.tar.gz
          retention-days: 30
