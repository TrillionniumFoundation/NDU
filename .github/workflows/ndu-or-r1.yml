name: NDU OR R1 reproducibility
on:
  push:
    branches: ['revision/ndu-operations-research-r1-20260920']
    paths:
      - '.github/workflows/ndu-or-r1.yml'
      - 'revisions/or_r1_20260920/**'
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Preserve complete reviewed source and historical evidence
        run: git archive --format=tar HEAD > /tmp/ndu-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: ndu-or-r1-source
          path: /tmp/ndu-source.tar
          retention-days: 7
