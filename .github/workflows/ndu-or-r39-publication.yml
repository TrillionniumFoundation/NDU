name: NDU R39 robust contractual quantizer publication
on:
  push:
    branches: [revision/ndu-operations-research-r39-robust-quantizer-20260924]
    paths:
      - '.github/workflows/ndu-or-r39-publication.yml'
      - 'revisions/or-r39-robust-quantizer-20260924/BUILD'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ndu-or-r39-publication
  cancel-in-progress: false
env:
  BRANCH: revision/ndu-operations-research-r39-robust-quantizer-20260924
  R: revisions/or-r39-robust-quantizer-20260924
  OLD: revisions/or-r38-contractual-quantization-20260924
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  publish:
    if: github.ref == 'refs/heads/revision/ndu-operations-research-r39-robust-quantizer-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify locally executed source identity and recover predecessor
        run: |
          test "$(git branch --show-current)" = "$BRANCH"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          r=Path(os.environ['R'])
          for name,want in json.loads((r/'SOURCE_TRANSPORT_SHA256.json').read_text()).items():
              assert hashlib.sha256((r/name).read_bytes()).hexdigest()==want,name
          PY
          python "$R/assemble.py"
      - name: Execute exact new and inherited suites and prepare readers
        run: python "$R/code/build.py" prepare
      - name: Commit scientific sources before compiling readers
        run: |
          git config user.name 'NDU revision publication'
          git config user.email 'ndu-revision@users.noreply.github.com'
          git add main.tex electronic_companion.tex README.md NDU_OR_submission_checklist.md "$R" "$OLD"
          git add -f "$R/predecessor/main.pdf" "$R/predecessor/electronic_companion.pdf"
          if ! git diff --cached --quiet; then
            git commit -m 'paper(or-r39): prove all-promise transport and certify joint contractual quantizer allocation'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
      - name: Install reader compilation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-extra texlive-fonts-recommended texlive-plain-generic texlive-science poppler-utils
      - name: Compile and validate committed readers and historical preservation
        run: python "$R/code/build.py" build
      - name: Publish validated article companion response and build identity
        run: |
          test "$(git branch --show-current)" = "$BRANCH"
          git add -f main.pdf electronic_companion.pdf r39-main-labels.aux r39-ec-labels.aux "$R/RESPONSE_TO_REFEREES.pdf" "$R/BUILD_VALIDATION.json" "$R/PRESERVATION_MANIFEST.json"
          if ! git diff --cached --quiet; then
            git commit -m 'paper(or-r39): publish validated Operations Research readers and reproducible certificates'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ndu-or-r39-reader-build
          include-hidden-files: true
          path: |
            main.tex
            electronic_companion.tex
            main.pdf
            electronic_companion.pdf
            README.md
            NDU_OR_submission_checklist.md
            r39-*-labels.aux
            revisions/or-r39-robust-quantizer-20260924/
            revisions/or-r38-contractual-quantization-20260924/
            revisions/or-r37-integrated-frontier-20260924/
            revisions/or-r33-piecewise-randomized-20260923/
            revisions/or-r34-global-randomized-frontier-20260923/
            revisions/or-r35-monge-frontier-20260923/
            revisions/or-r36-linear-frontier-20260924/
            .build/ndu-r39/
            !revisions/**/__pycache__/**
          retention-days: 30
          if-no-files-found: error
