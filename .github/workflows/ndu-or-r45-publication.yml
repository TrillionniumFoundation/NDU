name: NDU R45 budgeted compression publication
on:
  push:
    branches: [revision/ndu-operations-research-r45-budgeted-compression-20260924]
    paths:
      - '.github/workflows/ndu-or-r45-publication.yml'
      - 'revisions/or-r45-budgeted-compression-20260924/BUILD'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ndu-or-r45-publication
  cancel-in-progress: false
env:
  BRANCH: revision/ndu-operations-research-r45-budgeted-compression-20260924
  R: revisions/or-r45-budgeted-compression-20260924
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  publish:
    if: github.ref == 'refs/heads/revision/ndu-operations-research-r45-budgeted-compression-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and unpack isolated scientific source delivery
        run: python "$R/bootstrap.py"
      - name: Install independent verification dependencies
        run: |
          python -m pip install scipy==1.17.0 sympy==1.14.0
          mkdir -p "$R/results"
          python -m pip freeze > "$R/results/python_environment.txt"
      - name: Execute new theorems comparative studies and inherited exact regression
        run: python "$R/code/build.py" prepare
      - name: Commit and push scientific sources before compilation
        run: |
          test "$(git branch --show-current)" = "$BRANCH"
          git config user.name 'NDU revision publication'
          git config user.email 'ndu-revision@users.noreply.github.com'
          git add main.tex electronic_companion.tex README.md NDU_OR_submission_checklist.md "$R"
          git add -f "$R/predecessor/main.pdf" "$R/predecessor/electronic_companion.pdf"
          if ! git diff --cached --quiet; then
            git commit -m 'paper(or-r45): same-budget approximation and exact charge-aware compression [skip ci]'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
      - name: Install Operations Research reader toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-extra texlive-fonts-recommended texlive-plain-generic texlive-science poppler-utils
      - name: Compile committed readers and audit full historical preservation
        run: python "$R/code/build.py" build
      - name: Publish validated main article companion and referee response
        run: |
          test "$(git branch --show-current)" = "$BRANCH"
          git add -f main.pdf electronic_companion.pdf r45-main-labels.aux r45-ec-labels.aux "$R/RESPONSE_TO_REFEREES.pdf" "$R/BUILD_VALIDATION.json" "$R/PRESERVATION_MANIFEST.json"
          if ! git diff --cached --quiet; then
            git commit -m 'paper(or-r45): validated OR readers and full inherited-tree preservation [skip ci]'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ndu-or-r45-referee-package
          include-hidden-files: true
          path: |
            main.tex
            electronic_companion.tex
            main.pdf
            electronic_companion.pdf
            README.md
            NDU_OR_submission_checklist.md
            r45-*-labels.aux
            revisions/or-r45-budgeted-compression-20260924/
            reviews/operation_research_referee_report_r44_independent_harsh_2026-09-24.md
            .build/ndu-r45/
            !revisions/**/__pycache__/**
          retention-days: 30
          if-no-files-found: error
