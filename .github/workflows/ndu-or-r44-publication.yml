name: NDU R44 resource augmentation publication
on:
  push:
    branches: [revision/ndu-operations-research-r44-resource-augmentation-20260924]
    paths:
      - '.github/workflows/ndu-or-r44-publication.yml'
      - 'revisions/or-r44-resource-augmentation-20260924/BUILD'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ndu-or-r44-publication
  cancel-in-progress: false
env:
  BRANCH: revision/ndu-operations-research-r44-resource-augmentation-20260924
  R: revisions/or-r44-resource-augmentation-20260924
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  publish:
    if: github.ref == 'refs/heads/revision/ndu-operations-research-r44-resource-augmentation-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble from immutable predecessor without historical edits
        run: python "$R/bootstrap.py"
      - name: Install inherited verification dependencies
        run: |
          python -m pip install sympy scipy pypdf
          python -m pip freeze > "$R/results/python_environment.txt"
      - name: Execute recovery independent certificates scaling and inherited exact suites
        run: python "$R/code/build.py" prepare
      - name: Commit and push scientific sources before compilation
        run: |
          test "$(git branch --show-current)" = "$BRANCH"
          git config user.name 'NDU revision publication'
          git config user.email 'ndu-revision@users.noreply.github.com'
          git add main.tex electronic_companion.tex README.md NDU_OR_submission_checklist.md "$R"
          git add -f "$R/predecessor/main.pdf" "$R/predecessor/electronic_companion.pdf"
          if ! git diff --cached --quiet; then
            git commit -m 'paper(or-r44): publish complete recovery proofs and executed independent certificates'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
      - name: Install Operations Research reader toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-extra texlive-fonts-recommended texlive-plain-generic texlive-science poppler-utils
      - name: Compile and validate committed readers and full-tree preservation
        run: python "$R/code/build.py" build
      - name: Publish validated main article companion and referee response
        run: |
          test "$(git branch --show-current)" = "$BRANCH"
          git add -f main.pdf electronic_companion.pdf r44-main-labels.aux r44-ec-labels.aux "$R/RESPONSE_TO_REFEREES.pdf" "$R/BUILD_VALIDATION.json" "$R/PRESERVATION_MANIFEST.json"
          if ! git diff --cached --quiet; then
            git commit -m 'paper(or-r44): publish validated Operations Research readers and historical preservation audit'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ndu-or-r44-referee-package
          include-hidden-files: true
          path: |
            main.tex
            electronic_companion.tex
            main.pdf
            electronic_companion.pdf
            README.md
            NDU_OR_submission_checklist.md
            r44-*-labels.aux
            revisions/or-r44-resource-augmentation-20260924/
            reviews/operation_research_referee_report_r42_independent_harsh_2026-09-24.md
            .build/ndu-r44/
            !revisions/**/__pycache__/**
          retention-days: 30
          if-no-files-found: error
